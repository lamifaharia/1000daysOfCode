<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>To-Do List</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>To-Do List</h1>

        <p class="subtitle">
            Add your tasks and stay organized.
        </p>


        <!-- Add Task -->
        <div class="input-area">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter a task..."
            >

            <button id="addBtn">
                Add
            </button>

        </div>


        <!-- Task List -->
        <ul id="taskList"></ul>


        <!-- Task Counter -->
        <p id="taskCount">
            Tasks: 0
        </p>


        <!-- Clear All -->
        <button id="clearBtn">
            Clear All
        </button>

    </div>


    <script src="script.js"></script>

</body>

</html>
