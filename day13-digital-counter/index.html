<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Digital Counter</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>Digital Counter</h1>

        <p class="subtitle">
            Increase, decrease, or reset the counter.
        </p>


        <div class="counter-box">

            <span id="counter">0</span>

        </div>


        <div class="buttons">

            <button id="decreaseBtn">
                −
            </button>

            <button id="resetBtn">
                Reset
            </button>

            <button id="increaseBtn">
                +
            </button>

        </div>


        <p id="message">
            Current value: 0
        </p>

    </div>


    <script src="script.js"></script>

</body>

</html>
