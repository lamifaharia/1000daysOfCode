<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Temperature Converter</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>🌡️ Temperature Converter</h1>

        <p class="subtitle">
            Convert temperatures between Celsius and Fahrenheit.
        </p>

        <div class="input-group">

            <label for="temperature">
                Enter Temperature
            </label>

            <input
                type="number"
                id="temperature"
                placeholder="Enter temperature"
            >

        </div>

        <div class="radio-group">

            <label>
                <input
                    type="radio"
                    name="conversion"
                    value="cToF"
                    checked
                >

                Celsius ➜ Fahrenheit

            </label>

            <label>
                <input
                    type="radio"
                    name="conversion"
                    value="fToC"
                >

                Fahrenheit ➜ Celsius

            </label>

        </div>

        <button id="convertBtn">
            Convert
        </button>

        <div class="result">

            <h2>Result</h2>

            <p id="result">
                --
            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
