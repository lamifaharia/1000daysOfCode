<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Digital Clock</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="clock-container">

        <!-- Clock Title -->
        <h1>🕐 Digital Clock</h1>

        <!-- Time -->
        <div id="time">
            12:00:00 AM
        </div>

        <!-- Date -->
        <div id="date">
            Monday, January 1, 2026
        </div>

        <!-- Location -->
        <div class="location">
            Bangladesh 🇧🇩
        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
