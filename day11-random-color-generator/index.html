<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Random Color Generator</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>Random Color Generator</h1>

        <p class="subtitle">
            Generate a random color with one click.
        </p>


        <div class="color-box">

            <p id="colorCode">#6366f1</p>

        </div>


        <button id="generateBtn">
            Generate Color
        </button>


        <p id="message">
            Click the button to generate a new color.
        </p>

    </div>


    <script src="script.js"></script>

</body>
</html>
