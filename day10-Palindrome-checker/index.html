<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Palindrome Checker</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <!-- Heading -->

        <h1>🔤 Palindrome Checker</h1>

        <p class="subtitle">
            Check if a word or phrase reads the same
            forward and backward.
        </p>


        <!-- Input -->

        <div class="input-group">

            <label for="textInput">
                Enter a word or phrase
            </label>

            <input
                type="text"
                id="textInput"
                placeholder="e.g. madam"
            >

        </div>


        <!-- Check Button -->

        <button id="checkBtn">
            🔍 Check
        </button>


        <!-- Result -->

        <div id="result" class="result">
            Enter something to check.
        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
