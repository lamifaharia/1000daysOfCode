<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Palindrome Checker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Palindrome Checker</h1>

        <p class="subtitle">
            Check if a word or number reads the same backwards.
        </p>


        <div class="input-box">

            <input
                type="text"
                id="textInput"
                placeholder="Enter a word or number"
            >

            <button id="checkBtn">
                Check
            </button>

        </div>


        <p id="result"></p>

    </div>


    <script src="script.js"></script>

</body>
</html>
