
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QR Code Generator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>QR Code Generator</h1>

        <p class="subtitle">
            Turn your text or URL into a QR code.
        </p>

        <!-- Text input -->
        <textarea
            id="textInput"
            placeholder="Enter text or paste a URL..."
            rows="3"
        ></textarea>

        <!-- Generate button -->
        <button id="generateBtn">
            Generate QR Code
        </button>

        <!-- Feedback message -->
        <p id="message"></p>

        <!-- QR code output -->
        <div id="qrContainer" class="qr-container"></div>

        <!-- Download button -->
        <a id="downloadBtn" class="download-btn" hidden>
            Download QR Code
        </a>

    </div>

    <!-- QR Code library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script src="script.js"></script>

</body>

</html>
