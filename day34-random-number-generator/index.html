
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Random Number Generator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>🎲 Random Number Generator</h1>

        <p class="subtitle">
            Set your range and generate a random number!
        </p>

        <!-- Number range inputs -->
        <div class="input-group">

            <div class="input-field">
                <label for="minNumber">Minimum Number</label>
                <input
                    type="number"
                    id="minNumber"
                    value="1"
                    placeholder="Enter minimum"
                >
            </div>

            <div class="input-field">
                <label for="maxNumber">Maximum Number</label>
                <input
                    type="number"
                    id="maxNumber"
                    value="100"
                    placeholder="Enter maximum"
                >
            </div>

        </div>

        <!-- Generated number -->
        <div class="result-box">
            <p>Your Random Number</p>
            <h2 id="result">?</h2>
        </div>

        <!-- Generate button -->
        <button id="generateBtn" type="button">
            Generate Number
        </button>

        <!-- Copy button -->
        <button id="copyBtn" type="button">
            Copy Number
        </button>

        <!-- Feedback -->
        <p id="message" aria-live="polite">
            Enter your range to get started!
        </p>

    </main>

    <script src="script.js"></script>

</body>

</html>
