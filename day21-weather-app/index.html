<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Weather App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Weather App</h1>

        <p class="subtitle">
            Check the weather of any city.
        </p>


        <!-- Search Area -->
        <div class="search-area">

            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name..."
            >

            <button id="searchBtn">
                Search
            </button>

        </div>


        <!-- Weather Card -->
        <div class="weather-card">

            <h2 id="cityName">
                City
            </h2>

            <div class="weather-icon" id="weatherIcon">
                🌤️
            </div>

            <h3 id="temperature">
                --°C
            </h3>

            <p id="description">
                Weather information
            </p>

            <div class="details">

                <div>
                    <span id="humidity">--%</span>
                    <p>Humidity</p>
                </div>

                <div>
                    <span id="wind">-- km/h</span>
                    <p>Wind</p>
                </div>

            </div>

        </div>


        <p id="message"></p>

    </div>


    <script src="script.js"></script>

</body>

</html>
