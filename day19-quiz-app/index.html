<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Quiz App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Quiz App</h1>

        <p class="subtitle">
            Test your knowledge with this quick quiz.
        </p>


        <!-- Question Number -->
        <p id="questionNumber">
            Question 1 of 5
        </p>


        <!-- Question -->
        <h2 id="question">
            Question will appear here
        </h2>


        <!-- Answer Buttons -->
        <div id="answerButtons" class="answer-buttons">
            <!-- Answers will be added by JavaScript -->
        </div>


        <!-- Next Button -->
        <button id="nextBtn">
            Next Question
        </button>


        <!-- Score -->
        <p id="score">
            Score: 0
        </p>

    </div>


    <script src="script.js"></script>

</body>

</html>
