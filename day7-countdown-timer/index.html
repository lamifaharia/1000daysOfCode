<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Countdown Timer</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="timer-container">

        <!-- Title -->
        <h1>⏳ Countdown Timer</h1>

        <p class="subtitle">
            Set a time and start the countdown.
        </p>


        <!-- Timer Display -->
        <div id="timer">
            00:00
        </div>


        <!-- Input -->
        <div class="input-group">

            <label for="secondsInput">
                Enter Seconds
            </label>

            <input
                type="number"
                id="secondsInput"
                placeholder="Enter seconds"
                min="1"
            >

        </div>


        <!-- Buttons -->
        <div class="buttons">

            <button id="startBtn">
                ▶️ Start
            </button>

            <button id="pauseBtn">
                ⏸️ Pause
            </button>

            <button id="resetBtn">
                🔄 Reset
            </button>

        </div>


        <!-- Status -->
        <div class="status">

            <p id="statusMessage">
                Ready to start!
            </p>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
