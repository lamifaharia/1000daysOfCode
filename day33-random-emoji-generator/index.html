
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Random Emoji Generator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>😎 Random Emoji Generator</h1>

        <p class="subtitle">
            Click the button and discover a random emoji!
        </p>

        <!-- Emoji display -->
        <div class="emoji-display" id="emojiDisplay">
            😊
        </div>

        <!-- Emoji name -->
        <h2 id="emojiName">Smiling Face</h2>

        <!-- Generate button -->
        <button id="generateBtn" type="button">
            Generate Random Emoji
        </button>

        <!-- Copy button -->
        <button id="copyBtn" type="button">
            Copy Emoji
        </button>

        <!-- Feedback -->
        <p id="message" aria-live="polite">
            Let's find a new emoji!
        </p>

    </main>

    <script src="script.js"></script>

</body>

</html>
