<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Number Guessing Game</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>Number Guessing Game</h1>

        <p class="subtitle">
            Guess the secret number between 1 and 100.
        </p>


        <div class="game-box">

            <label for="guessInput">
                Enter your guess
            </label>

            <input
                type="number"
                id="guessInput"
                min="1"
                max="100"
                placeholder="Enter a number"
            >

            <button id="guessBtn">
                Check Guess
            </button>

            <p id="result">
                Start guessing!
            </p>

            <p id="attempts">
                Attempts: 0
            </p>

            <button id="resetBtn">
                New Game
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
